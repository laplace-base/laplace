env_files = ["./.env"]

[config]
default_to_workspace = false
additional_profiles = ["debug"]


[env]
APP_NAME = "laplace"
TARGET_DIR = "target"
BACK_OUTPUT_DIR = "lapps/back"
FRONT_OUTPUT_DIR = "lapps/front"
ANDROID_PACKAGE = "org.laplace"
ANDROID_PROJECT_DIR = "crates/app/gen/android"
# NOTE: `web_sys_unstable_apis` cfg enables the Web Animations bindings in web-sys used by `wingy-hypertext-web`.
RUSTFLAGS = "--cfg=web_sys_unstable_apis"

[tasks.choose-profile.env]
PROFILE = "release"
PROFILE_BUILD_DIR = "${PROFILE}"

    [tasks.choose-profile.env.debug]
    PROFILE = "dev"
    PROFILE_BUILD_DIR = "debug"
    DEBUG_FLAG = "--debug"

[tasks.choose-profile-web.env]
RUSTFLAGS = "-Copt-level=z --cfg=web_sys_unstable_apis"
PROFILE = "wasm-release"
PROFILE_BUILD_DIR = "${PROFILE}"

    [tasks.choose-profile-web.env.debug]
    RUSTFLAGS = "--cfg=web_sys_unstable_apis"
    PROFILE = "dev"
    PROFILE_BUILD_DIR = "debug"

## -----------
## MARK: Front
## -----------

[tasks.build-front]
command = "cargo"
toolchain = "stable"
args = ["build", "-p", "${APP_NAME}-front", "--target", "wasm32-unknown-unknown", "--profile", "${PROFILE}"]
dependencies = ["choose-profile-web"]

[tasks.clean-static]
script_runner = "@duckscript"
script = '''
entries = glob_array ${FRONT_OUTPUT_DIR}/${APP_NAME}/*
for entry in ${entries}
    if not equals ${entry} ${FRONT_OUTPUT_DIR}/${APP_NAME}/dist
        rm -r ${entry}
    end
end
'''

[tasks.copy-static]
script_runner = "@duckscript"
script = '''
if eq ${APP_NAME} "laplace"
    glob_cp crates/front/webassets/**/* ${FRONT_OUTPUT_DIR}/${APP_NAME}/
elseif eq ${APP_NAME} "vendor"
    glob_cp webassets/vendor/**/* ${FRONT_OUTPUT_DIR}/${APP_NAME}/
else
    glob_cp examples/${APP_NAME}/front/webassets/**/* ${FRONT_OUTPUT_DIR}/${APP_NAME}/
end
'''
dependencies = ["clean-static"]

[tasks.bindgen-front]
command = "wasm-bindgen"
args = [
    "--target",
    "web",
    "--no-typescript",
    "--remove-name-section",
    "--remove-producers-section",
    "--out-dir",
    "${TARGET_DIR}/dist",
    "--out-name",
    "${APP_NAME}-front",
    "${TARGET_DIR}/wasm32-unknown-unknown/${PROFILE_BUILD_DIR}/${APP_NAME}_front.wasm",
]

[tasks.optimize-front]
condition = { env = { PROFILE = "wasm-release" } }
command = "wasm-opt"
args = [
    "-Oz",
    "--strip-debug",
    "-o",
    "${TARGET_DIR}/dist/${APP_NAME}-front_bg.wasm",
    "${TARGET_DIR}/dist/${APP_NAME}-front_bg.wasm",
]

[tasks.clean-dist]
script_runner = "@duckscript"
script = '''
rm -r ${FRONT_OUTPUT_DIR}/${APP_NAME}/dist
'''

[tasks.deploy-front]
script_runner = "@duckscript"
script = '''
glob_cp ${TARGET_DIR}/dist/${APP_NAME}-front_bg.wasm ${FRONT_OUTPUT_DIR}/${APP_NAME}/dist/
glob_cp ${TARGET_DIR}/dist/${APP_NAME}-front.js ${FRONT_OUTPUT_DIR}/${APP_NAME}/dist/
'''
dependencies = ["clean-dist"]

[tasks.bundle-front]
condition = { files_modified = { input = [
    "${TARGET_DIR}/wasm32-unknown-unknown/${PROFILE_BUILD_DIR}/${APP_NAME}_front.wasm",
], output = [
    "${TARGET_DIR}/dist/${APP_NAME}-front_bg.wasm",
] } }
run_task = { name = ["bindgen-front", "optimize-front"] }
dependencies = ["build-front"]

[tasks.front]
dependencies = ["bundle-front", "copy-static", "deploy-front"]

## ----------
## MARK: Back
## ----------

[tasks.build-back]
command = "cargo"
toolchain = "stable"
args = ["component", "build", "-p", "${APP_NAME}-back", "--profile", "${PROFILE}"]
dependencies = ["choose-profile"]

[tasks.deploy-back]
script_runner = "@duckscript"
script = '''
cp target/wasm32-wasip1/${PROFILE_BUILD_DIR}/${APP_NAME}_back.wasm ${BACK_OUTPUT_DIR}/${APP_NAME}/${APP_NAME}-back.wasm
'''

[tasks.back]
dependencies = ["build-back", "deploy-back"]

## ---------
## MARK: App
## ---------

[tasks.build-app]
command = "cargo"
toolchain = "stable"
args = ["tauri", "build", "@@remove-empty(DEBUG_FLAG)"]
dependencies = ["choose-profile"]

[tasks.app]
run_task = "build-app"
dependencies = ["choose-profile"]

[tasks.vendor]
env = { APP_NAME = "vendor" }
run_task = "copy-static"

[tasks.laplace-front]
env = { APP_NAME = "laplace" }
run_task = "front"
dependencies = ["vendor"]

[tasks.laplace]
env = { APP_NAME = "laplace" }
run_task = "app"
dependencies = ["laplace-front"]

[tasks.echo]
env = { APP_NAME = "echo" }
run_task = { name = ["front", "back"] }

[tasks.examples]
dependencies = ["echo"]

[tasks.lapps]
description = "Build everything that is deployed: vendored web assets, the Laplace frontend and the examples"
dependencies = ["laplace-front", "examples"]

[tasks.all]
dependencies = ["laplace", "examples"]

## -------------
## MARK: Android
## -------------

# `cargo tauri android` needs `ANDROID_HOME` and `NDK_HOME` (or `ANDROID_NDK_ROOT`) pointing at an
# installed SDK and NDK, and `JAVA_HOME` at a JDK 17+ — see the Android section of the README.

[tasks.choose-profile-android]
dependencies = ["choose-profile"]

[tasks.choose-profile-android.env]
ANDROID_SIGN = true
APK_OUT_DIR = "${ANDROID_PROJECT_DIR}/app/build/outputs/apk/universal/${PROFILE_BUILD_DIR}"

    [tasks.choose-profile-android.env.debug]
    ANDROID_SIGN = false

[tasks.android-build]
description = "Build a universal APK (all ABIs)"
command = "cargo"
args = ["tauri", "android", "build", "--apk", "@@remove-empty(DEBUG_FLAG)"]
dependencies = ["choose-profile-android", "lapps"]

[tasks.android-keystore]
description = "Generate the release keystore (interactive; asks for the passwords and the certificate fields)"
condition = { env_true = ["ANDROID_SIGN"], files_not_exist = ["${ANDROID_KEYSTORE}"] }
command = "keytool"
args = [
    "-genkeypair",
    "-v",
    "-keystore",
    "${ANDROID_KEYSTORE}",
    "-keyalg",
    "RSA",
    "-keysize",
    "2048",
    "-validity",
    "10000",
    "-alias",
    "laplace",
]
dependencies = ["choose-profile-android"]

[tasks.android-sign]
description = "Zipalign and sign the release APK with `${ANDROID_KEYSTORE}` (no-op for `-p debug`)"
condition = { env_true = ["ANDROID_SIGN"] }
script_runner = "@duckscript"
script = '''
unsigned_apk = set "${APK_OUT_DIR}/app-universal-release-unsigned.apk"
aligned_apk = set "${APK_OUT_DIR}/app-universal-release-aligned.apk"
signed_apk = set "${APK_OUT_DIR}/app-universal-release-signed.apk"

exec --fail-on-error zipalign -f -p 4 ${unsigned_apk} ${aligned_apk}
exec --fail-on-error apksigner sign --ks ${ANDROID_KEYSTORE} --ks-key-alias laplace --ks-pass env:ANDROID_KEYSTORE_PASS --key-pass env:ANDROID_KEY_PASS --out ${signed_apk} ${aligned_apk}
rm ${aligned_apk}
exec --fail-on-error apksigner verify --print-certs ${signed_apk}
'''
dependencies = ["choose-profile-android", "android-keystore"]

[tasks.android-log]
description = "Follow the Rust-side log of the app on the connected device or emulator"
command = "adb"
args = ["logcat", "-s", "Laplace:V", "RustStdoutStderr:V"]

[tasks.android-dev]
description = "Build, install and run a debug build on a connected device with its log attached"
command = "cargo"
args = ["tauri", "android", "dev"]
dependencies = ["lapps"]

[tasks.android-install]
description = "Install the built APK on the connected device or emulator"
env = { APK_NAME = { source = "${PROFILE}", default_value = "app-universal-release-signed.apk", mapping = { "dev" = "app-universal-debug.apk" } } }
command = "adb"
args = ["install", "-r", "${APK_OUT_DIR}/${APK_NAME}"]
dependencies = ["choose-profile-android"]

[tasks.android]
description = "Build, sign, install and launch the Android app"
dependencies = ["android-build", "android-sign", "android-install"]

[tasks.android-start]
description = "Launch the installed app on the connected device or emulator"
command = "adb"
args = ["shell", "am", "start", "-n", "${ANDROID_PACKAGE}/.MainActivity"]

## -----------------
## MARK: Run
## -----------------

[tasks.start]
env = { APP_NAME = "laplace", RUST_LOG = { value = "info", condition = { env_not_set = ["RUST_LOG"] } } }
command = "target/${PROFILE}/${APP_NAME}-app"
dependencies = ["choose-profile"]

[tasks.run]
extend = "start"
dependencies = ["all"]


[tasks.watch.env]
WATCH_COMMAND = "cargo make front"

    [tasks.watch.env.debug]
    WATCH_COMMAND = "cargo make -p debug front"

[tasks.watch]
command = "watchexec"
args = ["-r", "-w", "crates/laplace-front", "${WATCH_COMMAND}"]
dependencies = ["choose-profile"]

## -----------------
## MARK: Lint & Test
## -----------------

[tasks.fmt-check]
toolchain = "nightly"
command = "cargo"
args = ["fmt", "--check"]

[tasks.clippy]
toolchain = "stable"
command = "cargo"
args = ["clippy", "--all-targets", "--", "-D", "warnings"]
dependencies = ["choose-profile"]

[tasks.lint]
run_task = "clippy"
dependencies = ["fmt-check"]

[tasks.test]
toolchain = "stable"
command = "cargo"
args = ["test"]
dependencies = ["choose-profile"]

[tasks.lint-test]
run_task = "test"
dependencies = ["lint"]
