[workspace]
resolver = "3"
members = [
    "crates/*",
    "examples/echo/back",
    "examples/echo/front",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/laplace-base/laplace"
authors = [
    "Alexander Mescheryakov <freecoder.xx@gmail.com>",
]

[profile.release]
lto = true

[profile.wasm-release]
inherits = "release"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[workspace.dependencies]
android_logger = { version = "0.15", default-features = false }
anyhow = "1.0"
ban = "3.9"
clap = { version = "4.6", features = ["derive"] }
config = "0.15"
console_log = "1.1"
flexi_logger = "0.31"
http = "1.5"
http-serde = "2.1"
hypertext = { git = "https://github.com/XX/hypertext", branch = "dev", features = ["axum", "htmx"] }
icondata = "0.7"
iconic = { git = "https://github.com/XX/iconic", features = ["hypertext", "fontawesome", "fontawesome-ext"] }
jni = "0.21" # NOTE: `tao` links jni 0.21, so the same version keeps a single copy of it in the binary.
js-sys = "0.3"
laplace-common-api = { path = "crates/common-api" }
laplace-front-api = { path = "crates/front-api" }
laplace-settings = { path = "crates/settings" }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
tauri = { version = "2.11", features = ["config-toml", "devtools"] }
tauri-build = { version = "2.7", default-features = false, features = ["config-toml"] }
thiserror = "2.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-dom = "2.2"
wasm-web-helpers = "0.2"
wasmtime = "49.0"
wasmtime-wasi = "49.0"
web-sys = { version = "0.3" }
wingy-hypertext = { git = "https://github.com/XX/wingy-hypertext", branch = "dev" }
wingy-hypertext-web = { git = "https://github.com/XX/wingy-hypertext", branch = "dev" }
wit-bindgen-rt = { version = "0.44", features = ["bitflags"] }
