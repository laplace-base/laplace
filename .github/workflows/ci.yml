name: "Lint & Test"

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libdbus-1-dev

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable, nightly
          target: wasm32-wasip1
          components: clippy, rustfmt

      - name: Install cargo-make and cargo-component
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make,cargo-component

      # `tauri::generate_context!` fails to compile when `frontend-dist` does not exist.
      - name: Create the frontend dist directory
        run: mkdir -p lapps/front

      - name: Run linting and formatting
        run: cargo make lint

      - name: Run tests
        run: cargo make test
