product-name = "laplace"
version = "0.1.0"
identifier = "org.laplace"

[build]
# dev-url = "http://localhost:1420"
# before-dev-command = "trunk serve"
# before-build-command = "trunk build"
frontend-dist = "../../lapps/front/"

[bundle]
active = false
targets = "all"
icon = [
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/icon.icns",
    "icons/icon.ico"
]

[app]
# Whether we should inject the Tauri API on `window.__TAURI__` or not.
with-global-tauri = true

[[app.windows]]
title = "Laplace"
width = 1200
height = 800
